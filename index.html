    <!--
      Runs before first paint. Flags that JS is available (so reveal states can
      be pre-hidden without a flash), skips the intro on repeat visits, and
      installs a fail-safe that shows everything if animations never start.
    -->
    <script>
      (function () {
        var d = document.documentElement;
        d.classList.add("js");
        try {
          if (sessionStorage.getItem("slf-intro")) d.classList.add("intro-seen");
        } catch (e) {}
        setTimeout(function () {
          if (!window.__slfReady) d.classList.add("no-anim");
        }, 7000);
      })();
    </script>
